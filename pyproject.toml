[project]
name = "verifica-ai"
version = "0.1.0"
description = "Plataforma Multimodal em Cascata para Detecção de Phishing e Engenharia Social"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "ai-gateway",
    "image-extractor",
    "scan-orchestrator",
    "threat-intel-sync",
    "url-inspector",
    "research-runner",
]

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
contracts = { workspace = true }
ai-gateway = { workspace = true }
image-extractor = { workspace = true }
scan-orchestrator = { workspace = true }
threat-intel-sync = { workspace = true }
url-inspector = { workspace = true }
research-runner = { workspace = true }
# CPU-only torch wheels: the CUDA build is several GB and the gateway embeds one image per scan.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "httpx>=0.27.0",
    "fakeredis==2.39.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "services"]
addopts = "--import-mode=importlib"
markers = [
    "integration: testes que requerem infraestrutura externa (ex: Docker com Postgres)"
]
