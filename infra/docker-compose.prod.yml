services:
  caddy:
    image: caddy:2-alpine
    container_name: verifica-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public
    depends_on:
      - scan-orchestrator
      - web

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    container_name: verifica-web
    restart: unless-stopped
    networks:
      - public

  scan-orchestrator:
    build:
      context: ..
      dockerfile: services/scan-orchestrator/Dockerfile
    container_name: verifica-orchestrator
    restart: unless-stopped
    environment:
      - AI_GATEWAY_URL=http://ai-gateway:8001
      # Turn on only after seeding marcas_referencias and calibrating the threshold (R4).
      - VISUAL_RAG_ENABLED=${VISUAL_RAG_ENABLED:-false}
      - URL_INSPECTOR_URL=http://url-inspector:8002
      - IMAGE_EXTRACTOR_URL=http://image-extractor:8003
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://verifica:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/verifica_db
      # Research area sign-in: only the orchestrator holds the private key (it issues the tokens).
      - AUTH_JWT_PRIVATE_KEY=${AUTH_JWT_PRIVATE_KEY:?defina AUTH_JWT_PRIVATE_KEY no .env}
      - AUTH_JWT_PUBLIC_KEY=${AUTH_JWT_PUBLIC_KEY:?defina AUTH_JWT_PUBLIC_KEY no .env}
      - AUTH_ALLOWED_ORIGINS=https://verifica.ai
      - PUBLIC_BASE_URL=https://verifica.ai
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    networks:
      - public
      - internal
      - isolated-inspector
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      ai-gateway:
        condition: service_started

  # Applies pending migrations and exits; the orchestrator only starts after it succeeds.
  migrate:
    build:
      context: ..
      dockerfile: services/scan-orchestrator/Dockerfile
    container_name: verifica-migrate
    restart: "no"
    working_dir: /app/services/scan-orchestrator
    command: ["alembic", "upgrade", "head"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://verifica:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/verifica_db
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

  ai-gateway:
    build:
      context: ..
      dockerfile: services/ai-gateway/Dockerfile
    container_name: verifica-ai-gateway
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://verifica:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/verifica_db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    networks:
      - internal
    depends_on:
      # Visual RAG reads marcas_referencias, which only exists after the migrations.
      migrate:
        condition: service_completed_successfully

  url-inspector:
    build:
      context: ..
      dockerfile: services/url-inspector/Dockerfile
    container_name: verifica-url-inspector
    restart: unless-stopped
    environment:
      # No route to the internet of its own: every browser request goes through the egress proxy.
      - EGRESS_PROXY_URL=http://egress:3128
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    networks:
      - isolated-inspector
    depends_on:
      - egress

  # Egress proxy: resolves every request, applies the SSRF shield and connects to the validated IP.
  egress:
    build:
      context: ..
      dockerfile: services/url-inspector/Dockerfile
    container_name: verifica-egress
    restart: unless-stopped
    command: ["python", "-m", "url_inspector.egress"]
    networks:
      - isolated-inspector
      - egress-out

  image-extractor:
    build:
      context: ..
      dockerfile: services/image-extractor/Dockerfile
    container_name: verifica-image-extractor
    restart: unless-stopped
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    networks:
      - internal

  threat-intel-sync:
    build:
      context: ..
      dockerfile: services/threat-intel-sync/Dockerfile
    container_name: verifica-threat-intel-sync
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    networks:
      - internal
      - egress-out  # downloads feeds and the Tranco list from fixed, trusted hosts
    depends_on:
      - redis

  research-runner:
    build:
      context: ..
      dockerfile: services/research-runner/Dockerfile
    container_name: verifica-research-runner
    restart: unless-stopped
    environment:
      # Public key only: the research-runner checks tokens but can never issue one.
      - AUTH_JWT_PUBLIC_KEY=${AUTH_JWT_PUBLIC_KEY:?defina AUTH_JWT_PUBLIC_KEY no .env}
      - AUTH_ALLOWED_ORIGINS=https://verifica.ai
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    networks:
      - public
      - internal

  # --- Observability (R6): nothing is published to the internet. Prometheus scrapes the
  # collector on the internal network; the Jaeger and Grafana UIs listen on the server's
  # loopback only (open them through an SSH tunnel).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    container_name: verifica-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - internal
      - isolated-inspector  # the url-inspector has no other network; its browser cannot reach it (SSRF shield)
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    container_name: verifica-jaeger
    restart: unless-stopped
    user: "0"  # Badger writes to the named volume, which Docker creates owned by root
    command: ["--config=/etc/jaeger/config.yaml"]
    volumes:
      - ./observability/jaeger.yaml:/etc/jaeger/config.yaml:ro
      - jaegerdata_prod:/badger
    ports:
      - "127.0.0.1:16686:16686"
    networks:
      - internal
      - ops

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: verifica-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata_prod:/prometheus
    networks:
      - internal

  grafana:
    image: grafana/grafana:13.2.6
    container_name: verifica-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD no .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata_prod:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - internal
      - ops
    depends_on:
      - prometheus
      - jaeger

  postgres:
    image: pgvector/pgvector:pg16
    container_name: verifica-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: verifica_db
      POSTGRES_USER: verifica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifica -d verifica_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis/redis-stack-server:latest
    container_name: verifica-redis-prod
    restart: unless-stopped
    volumes:
      - redisdata_prod:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  public:
    driver: bridge
  internal:
    internal: true
  isolated-inspector:
    internal: true
  egress-out:
    driver: bridge
  ops:
    driver: bridge  # only to publish the Jaeger and Grafana UIs on the server's loopback

volumes:
  pgdata_prod:
  redisdata_prod:
  caddy_data:
  caddy_config:
  jaegerdata_prod:
  prometheusdata_prod:
  grafanadata_prod:
