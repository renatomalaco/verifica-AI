# Memory and CPU ceilings (mem_limit, cpus) are sized for an e2-standard-2 VM (2 vCPU, 8 GB):
# about 7.6 GB in total, so a heavy page in the inspector's Chromium or the SigLIP model in the
# ai-gateway cannot starve Postgres or the orchestrator. Tune them with `docker stats`.
services:
  caddy:
    image: caddy:2-alpine
    container_name: verifica-ai-caddy
    restart: always
    mem_limit: 128m
    cpus: "0.5"
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:?defina PUBLIC_DOMAIN no .env}
      - ACME_EMAIL=${ACME_EMAIL:?defina ACME_EMAIL no .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public
    depends_on:
      - scan-orchestrator
      - web

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    container_name: verifica-ai-web
    restart: unless-stopped
    mem_limit: 64m
    cpus: "0.25"
    networks:
      - public

  scan-orchestrator:
    build:
      context: ..
      dockerfile: services/scan-orchestrator/Dockerfile
    container_name: verifica-ai-orchestrator
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    environment:
      - AI_GATEWAY_URL=http://ai-gateway:8001
      # Turn on only after seeding marcas_referencias and calibrating the threshold (R4).
      - VISUAL_RAG_ENABLED=${VISUAL_RAG_ENABLED:-false}
      - URL_INSPECTOR_URL=http://url-inspector:8002
      - IMAGE_EXTRACTOR_URL=http://image-extractor:8003
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://verifica:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/verifica_db
      # Research area sign-in: only the orchestrator holds the private key (it issues the tokens).
      - AUTH_JWT_PRIVATE_KEY=${AUTH_JWT_PRIVATE_KEY:?defina AUTH_JWT_PRIVATE_KEY no .env}
      - AUTH_JWT_PUBLIC_KEY=${AUTH_JWT_PUBLIC_KEY:?defina AUTH_JWT_PUBLIC_KEY no .env}
      - AUTH_ALLOWED_ORIGINS=https://${PUBLIC_DOMAIN:?defina PUBLIC_DOMAIN no .env}
      - PUBLIC_BASE_URL=https://${PUBLIC_DOMAIN:?defina PUBLIC_DOMAIN no .env}
      # Signs the anonymous device cookie of the "Me explica" quota; without it every restart
      # issues new cookies and resets everyone's quota.
      - DEVICE_TOKEN_SECRET=${DEVICE_TOKEN_SECRET:?defina DEVICE_TOKEN_SECRET no .env}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    networks:
      - public
      - internal
      - isolated-inspector
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      ai-gateway:
        condition: service_started

  # Applies pending migrations and exits; the orchestrator only starts after it succeeds.
  migrate:
    build:
      context: ..
      dockerfile: services/scan-orchestrator/Dockerfile
    container_name: verifica-ai-migrate
    restart: "no"
    mem_limit: 256m
    cpus: "0.5"
    working_dir: /app/services/scan-orchestrator
    command: ["alembic", "upgrade", "head"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://verifica:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/verifica_db
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

  ai-gateway:
    build:
      context: ..
      dockerfile: services/ai-gateway/Dockerfile
    container_name: verifica-ai-gateway
    restart: unless-stopped
    mem_limit: 1280m
    cpus: "1.5"
    environment:
      - DATABASE_URL=postgresql+asyncpg://verifica:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/verifica_db
      # Real models in production: Gemini for the triage and the "Me explica". Required, so a
      # missing line never silently falls back to the keyword simulator.
      - AI_PROVIDER=${AI_PROVIDER:?defina AI_PROVIDER no .env (gemini)}
      - EXPLAIN_PROVIDER=${EXPLAIN_PROVIDER:?defina EXPLAIN_PROVIDER no .env (gemini)}
      - GEMINI_API_KEY=${GEMINI_API_KEY:?defina GEMINI_API_KEY no .env}
      - GEMINI_MODEL=${GEMINI_MODEL:?defina GEMINI_MODEL no .env (ex. gemini-3.5-flash-lite)}
      # Optional light reserve, tried once when GEMINI_MODEL or GEMINI_DEEP_MODEL fails.
      - GEMINI_FALLBACK_MODEL=${GEMINI_FALLBACK_MODEL:-}
      # Confirms doubtful triages and every would-be SEGURO.
      - GEMINI_DEEP_MODEL=${GEMINI_DEEP_MODEL:?defina GEMINI_DEEP_MODEL no .env (ex. gemini-3.5-flash)}
      # Gray-zone VLM of the Visual RAG; it only matters once VISUAL_RAG_ENABLED is true.
      - VLM_PROVIDER=${VLM_PROVIDER:-none}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    networks:
      - internal
      - ai-egress  # its own way out, only to the Gemini API; no other service shares it
    depends_on:
      # Visual RAG reads marcas_referencias, which only exists after the migrations.
      migrate:
        condition: service_completed_successfully

  url-inspector:
    build:
      context: ..
      dockerfile: services/url-inspector/Dockerfile
    container_name: verifica-ai-url-inspector
    restart: unless-stopped
    # Each inspection starts its own Chromium. Without an init process the processes of an
    # interrupted inspection are never reaped, pile up and finally take the Playwright driver down.
    init: true
    # Chromium crashes on large pages with Docker's default 64 MB of shared memory.
    shm_size: "1gb"
    mem_limit: 1280m
    cpus: "1.5"
    environment:
      # No route to the internet of its own: every browser request goes through the egress proxy.
      # No telemetry either: the collector lives on the internal network, which this container
      # must not reach (the orchestrator already traces each inspection).
      - EGRESS_PROXY_URL=http://egress:3128
    networks:
      - isolated-inspector
    depends_on:
      - egress

  # Egress proxy: resolves every request, applies the SSRF shield and connects to the validated IP.
  egress:
    build:
      context: ..
      dockerfile: services/url-inspector/Dockerfile
    container_name: verifica-ai-egress
    restart: unless-stopped
    mem_limit: 192m
    cpus: "0.5"
    command: ["python", "-m", "url_inspector.egress"]
    networks:
      - isolated-inspector
      - egress-out

  image-extractor:
    build:
      context: ..
      dockerfile: services/image-extractor/Dockerfile
    container_name: verifica-ai-image-extractor
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    networks:
      - internal

  threat-intel-sync:
    build:
      context: ..
      dockerfile: services/threat-intel-sync/Dockerfile
    container_name: verifica-ai-threat-intel-sync
    restart: unless-stopped
    mem_limit: 192m
    cpus: "0.25"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    networks:
      - internal
      - egress-out  # downloads feeds and the Tranco list from fixed, trusted hosts
    depends_on:
      - redis

  research-runner:
    build:
      context: ..
      dockerfile: services/research-runner/Dockerfile
    container_name: verifica-ai-research-runner
    restart: unless-stopped
    mem_limit: 768m
    cpus: "1.0"
    environment:
      # Public key only: the research-runner checks tokens but can never issue one.
      - AUTH_JWT_PUBLIC_KEY=${AUTH_JWT_PUBLIC_KEY:?defina AUTH_JWT_PUBLIC_KEY no .env}
      - AUTH_ALLOWED_ORIGINS=https://${PUBLIC_DOMAIN:?defina PUBLIC_DOMAIN no .env}
      # The study calls the same model as production. Without the prices (and their date) the
      # report marks Mode 2 as not executed instead of guessing a cost.
      - AI_PROVIDER=${AI_PROVIDER:?defina AI_PROVIDER no .env (gemini)}
      - GEMINI_API_KEY=${GEMINI_API_KEY:?defina GEMINI_API_KEY no .env}
      - GEMINI_MODEL=${GEMINI_MODEL:?defina GEMINI_MODEL no .env (ex. gemini-3.5-flash-lite)}
      - GEMINI_DEEP_MODEL=${GEMINI_DEEP_MODEL:?defina GEMINI_DEEP_MODEL no .env (ex. gemini-3.5-flash)}
      - GEMINI_PRICE_INPUT_USD_PER_1M=${GEMINI_PRICE_INPUT_USD_PER_1M:-}
      - GEMINI_PRICE_OUTPUT_USD_PER_1M=${GEMINI_PRICE_OUTPUT_USD_PER_1M:-}
      - GEMINI_PRICE_DATE=${GEMINI_PRICE_DATE:-}
      - RESEARCH_LLM_PAUSE_SECONDS=${RESEARCH_LLM_PAUSE_SECONDS:-0}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    networks:
      - public
      - internal

  # --- Observability (R6): nothing is published to the internet. Prometheus scrapes the
  # collector on the internal network; the Jaeger and Grafana UIs listen on the server's
  # loopback only (open them through an SSH tunnel).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    container_name: verifica-ai-otel-collector
    restart: unless-stopped
    mem_limit: 192m
    cpus: "0.25"
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks:
      - internal
      - isolated-inspector  # the url-inspector has no other network; its browser cannot reach it (SSRF shield)
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    container_name: verifica-ai-jaeger
    restart: unless-stopped
    mem_limit: 384m
    cpus: "0.5"
    user: "0"  # Badger writes to the named volume, which Docker creates owned by root
    command: ["--config=/etc/jaeger/config.yaml"]
    volumes:
      - ./observability/jaeger.yaml:/etc/jaeger/config.yaml:ro
      - jaegerdata_prod:/badger
    ports:
      - "127.0.0.1:16686:16686"
    networks:
      - internal
      - ops

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: verifica-ai-prometheus
    restart: unless-stopped
    mem_limit: 384m
    cpus: "0.5"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata_prod:/prometheus
    networks:
      - internal

  grafana:
    image: grafana/grafana:13.2.6
    container_name: verifica-ai-grafana
    restart: unless-stopped
    # At 192m Grafana kept evicting and re-reading its own files: 737 GB read from disk,
    # leaving the whole VM waiting on I/O.
    mem_limit: 512m
    cpus: "0.25"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD no .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata_prod:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - internal
      - ops
    depends_on:
      - prometheus
      - jaeger

  postgres:
    image: pgvector/pgvector:pg16
    container_name: verifica-ai-postgres-prod
    restart: unless-stopped
    mem_limit: 768m
    cpus: "1.0"
    environment:
      POSTGRES_DB: verifica_db
      POSTGRES_USER: verifica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifica -d verifica_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis/redis-stack-server:latest
    container_name: verifica-ai-redis-prod
    restart: unless-stopped
    mem_limit: 384m
    cpus: "0.5"
    volumes:
      - redisdata_prod:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  public:
    driver: bridge
  internal:
    internal: true
  isolated-inspector:
    internal: true
  egress-out:
    driver: bridge
  ai-egress:
    driver: bridge
  ops:
    driver: bridge  # only to publish the Jaeger and Grafana UIs on the server's loopback

volumes:
  pgdata_prod:
  redisdata_prod:
  caddy_data:
  caddy_config:
  jaegerdata_prod:
  prometheusdata_prod:
  grafanadata_prod:
