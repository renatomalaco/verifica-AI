# Retention (30 days) is set by --storage.tsdb.retention.time in the compose files.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    honor_labels: true  # keep job=<service name> from the collector instead of job=otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
