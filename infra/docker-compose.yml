services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: verifica-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: verifica_db
      POSTGRES_USER: verifica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifica -d verifica_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis/redis-stack-server:latest
    container_name: verifica-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Observability (R6), only with `docker compose --profile observability up -d`.
  # The services run on the host and export to localhost:4318 when
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 is set. Every port is bound to 127.0.0.1:
  # Jaeger http://localhost:16686, Grafana http://localhost:3000, Prometheus http://localhost:9090.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    container_name: verifica-otel-collector
    profiles: [observability]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    container_name: verifica-jaeger
    profiles: [observability]
    restart: unless-stopped
    user: "0"  # Badger writes to the named volume, which Docker creates owned by root
    command: ["--config=/etc/jaeger/config.yaml"]
    volumes:
      - ./observability/jaeger.yaml:/etc/jaeger/config.yaml:ro
      - jaegerdata:/badger
    ports:
      - "127.0.0.1:16686:16686"

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: verifica-prometheus
    profiles: [observability]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:13.2.6
    container_name: verifica-grafana
    profiles: [observability]
    restart: unless-stopped
    environment:
      # Local only (127.0.0.1): read-only dashboards without sign-in. Production requires a password.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - jaeger

volumes:
  pgdata:
  redisdata:
  jaegerdata:
  prometheusdata:
  grafanadata:
