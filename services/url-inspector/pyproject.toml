[project]
name = "url-inspector"
version = "0.1.0"
description = "Inspeção headless de páginas remotas, Playwright isolado e proteção SSRF"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic-settings>=2.4.0",
    "playwright>=1.47.0",
    "beautifulsoup4>=4.12.0",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["url_inspector"]
