[project]
name = "scan-orchestrator"
version = "0.1.0"
description = "Orquestrador central de análises, detecção de canais e cascata"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "sse-starlette>=2.1.0",
    "slowapi>=0.1.9",
    "tldextract==5.3.2",
    "python-multipart==0.0.32",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scan_orchestrator"]
