[project]
name = "threat-intel-sync"
version = "0.1.0"
description = "Sincronizador periodico de feeds de inteligencia de ameacas (OpenPhish, URLhaus) para Redis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.4.0",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["threat_intel_sync"]
