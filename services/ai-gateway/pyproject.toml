[project]
name = "ai-gateway"
version = "0.1.0"
description = "Gateway de Inteligência Artificial, Sanitização LGPD e Isolamento de Prompts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_gateway"]
