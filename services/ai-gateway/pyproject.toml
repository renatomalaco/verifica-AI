[project]
name = "ai-gateway"
version = "0.1.0"
description = "Gateway de Inteligência Artificial, Sanitização LGPD e Isolamento de Prompts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "tldextract==5.3.2",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "pillow>=10.4.0",
]

[project.optional-dependencies]
# Real Visual RAG embeddings; heavy, so unit tests run on the fake embedder without it.
siglip = [
    "torch>=2.5",
    "transformers>=4.47,<5",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_gateway"]
