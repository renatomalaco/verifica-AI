[project]
name = "research-runner"
version = "0.1.0"
description = "Serviço de ablação acadêmica, métricas para TCC, ECE e gate de regressão F1"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "ai-gateway",
    "scan-orchestrator",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
]

[tool.uv.sources]
contracts = { workspace = true }
ai-gateway = { workspace = true }
scan-orchestrator = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research_runner"]
